<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taste & Go — Scroll Sequence</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* Matches the warm off-white background of your frames */
      background-color: #f3efe6;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Scroll track length: 500vh gives smooth scrubbing across all 200+ frames */
    .scroll-container {
      position: relative;
      height: 500vh;
    }

    /* Sticky fullscreen canvas */
    .sticky-canvas-wrapper {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f3efe6;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Minimal neutral preloader (disappears as soon as frames load) */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: #f3efe6;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-box {
      width: min(90%, 420px);
      text-align: center;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    #loaderTitle {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #1a1a1a;
    }

    #loaderStatus {
      font-size: 0.85rem;
      color: #666666;
      margin-bottom: 1rem;
      font-family: monospace;
    }

    .loader-track {
      width: 100%;
      height: 6px;
      background: #e5e0d5;
      border-radius: 999px;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: #c8102e;
      transition: width 0.1s linear;
    }

    .upload-controls {
      display: none;
      border-top: 1px solid #eee;
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .upload-controls.show {
      display: block;
    }

    .btn-group {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .upload-btn {
      cursor: pointer;
      background: #1a1a1a;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Preloader (hides automatically once images finish loading) -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-box">
      <h2 id="loaderTitle">Loading Sequence...</h2>
      <p id="loaderStatus">0%</p>
      <div class="loader-track">
        <div class="loader-fill" id="loaderFill"></div>
      </div>

      <div class="upload-controls" id="uploadControls">
        <p style="font-size: 0.8rem; color: #555;">Select your ZIP or image folder:</p>
        <div class="btn-group">
          <label class="upload-btn">
            Select video-jpg.zip
            <input type="file" id="zipInput" accept=".zip" hidden />
          </label>
          <label class="upload-btn">
            Select Folder
            <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Clean Fullscreen Scroll Canvas -->
  <div class="scroll-container">
    <div class="sticky-canvas-wrapper">
      <canvas id="sequenceCanvas"></canvas>
    </div>
  </div>

  <script>
    const CONFIG = {
      totalFrames: 200,      // Total images in your folder
      basePath: "./",        // Loads 00001.jpg, 00002.jpg from the same folder
      padLength: 5,
      extension: ".jpg",
      lerpFactor: 0.14       // Smoothness of scroll scrubbing
    };

    const canvas = document.getElementById("sequenceCanvas");
    const ctx = canvas.getContext("2d");

    const loaderOverlay = document.getElementById("loaderOverlay");
    const loaderTitle = document.getElementById("loaderTitle");
    const loaderStatus = document.getElementById("loaderStatus");
    const loaderFill = document.getElementById("loaderFill");
    const uploadControls = document.getElementById("uploadControls");
    const zipInput = document.getElementById("zipInput");
    const folderInput = document.getElementById("folderInput");

    let images = [];
    let targetFrame = 0;
    let currentFrame = 0;
    let isReady = false;

    function getFrameFilename(index) {
      return String(index).padStart(CONFIG.padLength, "0") + CONFIG.extension;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (isReady) {
        renderFrame(Math.round(currentFrame));
      }
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Uses Math.min ("contain") so the full "TASTE & GO" text is never cut off
    function renderFrame(index) {
      const img = images[index];
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const cw = window.innerWidth;
      const ch = window.innerHeight;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      // Fit entire frame inside the viewport without cropping top or bottom text
      const scale = Math.min(cw / iw, ch / ih);
      const drawWidth = iw * scale;
      const drawHeight = ih * scale;
      const x = (cw - drawWidth) / 2;
      const y = (ch - drawHeight) / 2;

      ctx.fillStyle = "#f3efe6";
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, x, y, drawWidth, drawHeight);
    }

    function animateLoop() {
      if (isReady && images.length > 0) {
        currentFrame += (targetFrame - currentFrame) * CONFIG.lerpFactor;
        const frameIndex = Math.min(
          images.length - 1,
          Math.max(0, Math.round(currentFrame))
        );
        renderFrame(frameIndex);
      }
      requestAnimationFrame(animateLoop);
    }
    requestAnimationFrame(animateLoop);

    window.addEventListener("scroll", () => {
      const scrollTop = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const scrollFraction = maxScroll > 0 ? Math.min(1, Math.max(0, scrollTop / maxScroll)) : 0;

      if (images.length > 0) {
        targetFrame = scrollFraction * (images.length - 1);
      }
    });

    function preloadLocalFrames() {
      let loaded = 0;
      let failed = 0;
      const tempImages = new Array(CONFIG.totalFrames);

      for (let i = 1; i <= CONFIG.totalFrames; i++) {
        const img = new Image();
        img.src = `${CONFIG.basePath}${getFrameFilename(i)}`;

        img.onload = () => {
          loaded++;
          tempImages[i - 1] = img;
          updateProgress(loaded, CONFIG.totalFrames);

          if (loaded + failed === CONFIG.totalFrames && loaded > 0) {
            finishLoading(tempImages.filter(Boolean));
          }
        };

        img.onerror = () => {
          failed++;
          if (failed >= 5 && loaded === 0) {
            loaderTitle.textContent = "Load Image Sequence";
            loaderStatus.textContent = "Select your ZIP or folder below";
            uploadControls.classList.add("show");
          } else if (loaded + failed === CONFIG.totalFrames && loaded > 0) {
            finishLoading(tempImages.filter(Boolean));
          }
        };
      }
    }

    function updateProgress(done, total) {
      const pct = Math.round((done / total) * 100);
      loaderStatus.textContent = `${pct}% (${done} / ${total})`;
      loaderFill.style.width = `${pct}%`;
    }

    function finishLoading(loadedImages) {
      images = loadedImages;
      isReady = true;
      currentFrame = 0;
      targetFrame = 0;
      renderFrame(0);
      loaderOverlay.classList.add("hidden");
    }

    zipInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loaderTitle.textContent = "Extracting Frames...";
      const zip = await JSZip.loadAsync(file);
      const entries = Object.values(zip.files)
        .filter((entry) => !entry.dir && /\.(jpe?g|png|webp)$/i.test(entry.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      const loadedImages = [];
      for (let i = 0; i < entries.length; i++) {
        const blob = await entries[i].async("blob");
        const img = await loadImageFromUrl(URL.createObjectURL(blob));
        loadedImages.push(img);
        updateProgress(i + 1, entries.length);
      }
      finishLoading(loadedImages);
    });

    folderInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files)
        .filter((f) => /\.(jpe?g|png|webp)$/i.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      if (!files.length) return;
      const loadedImages = [];
      for (let i = 0; i < files.length; i++) {
        const img = await loadImageFromUrl(URL.createObjectURL(files[i]));
        loadedImages.push(img);
        updateProgress(i + 1, files.length);
      }
      finishLoading(loadedImages);
    });

    function loadImageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    preloadLocalFrames();
  </script>
</body>
</html>
