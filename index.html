<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodVerse - 3D Food Delivery & Restaurant Discovery</title>
    <meta name="description" content="A gourmet food delivery and restaurant discovery platform featuring authentic high-definition dish photography, live scooter tracking, multi-role dashboards, and instant cart checkout." />
    <meta property="og:title" content="FoodVerse - 3D Food Delivery & Restaurant Discovery" />
    <meta property="og:description" content="A gourmet food delivery and restaurant discovery platform featuring authentic high-definition dish photography, live scooter tracking, multi-role dashboards, and instant cart checkout." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts for stylish typography options -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,600..800&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600..800;1,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          if (localStorage.getItem('foodverse_dark_mode') === 'true') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const savedFont = localStorage.getItem('foodverse_font');
          if (savedFont) {
            document.documentElement.setAttribute('data-font', savedFont);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
